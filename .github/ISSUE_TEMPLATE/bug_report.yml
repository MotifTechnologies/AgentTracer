name: Bug report
description: Report a reproducible problem with agent-tracer.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Search existing issues first.
        Report vulnerabilities privately using [SECURITY.md](https://github.com/MotifTechnologies/AgentTracer/blob/main/SECURITY.md).
        Remove credentials, private data, and sensitive paths from all examples and logs.
  - type: textarea
    id: problem
    attributes:
      label: What went wrong?
      description: Describe the problem and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the exact command and a minimal, sanitized config or task sample.
      placeholder: |
        1. Configure ...
        2. Run ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the error message or describe the incorrect result.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include versions and the relevant model, sandbox, and MCP configuration. Do not include API keys or private endpoint URLs.
      value: |
        - agent-tracer version or commit:
        - OS:
        - Python version:
        - uv version:
        - Model / endpoint provider:
        - Environment type (docker/local):
        - Docker version (if applicable):
        - MCP servers (if applicable):
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Optional sanitized logs or traceback.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed credentials and private data from this report.
          required: true
        - label: I agree to follow this project's [Code of Conduct](https://github.com/MotifTechnologies/AgentTracer/blob/main/CODE_OF_CONDUCT.md).
          required: true
