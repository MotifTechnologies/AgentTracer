[project]
name = "agent-tracer"
version = "0.1.0"
description = "Run agentic tasks and record structured trajectories as SFT/RL training data"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.5.0",
    "datasets>=5.0.1",
    "mcp>=2.2.0,<3",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "stirrup[docker,mcp]==0.2.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
compliance = [
    "cyclonedx-bom==7.5.0",
]
dev = [
    "bandit>=1.9.4",
    "license-expression==30.4.4",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pip-licenses>=5.5.5",
    "pytest>=9.1.1",
    "python-pptx>=1.0.2",
    "ruff>=0.16.8",
]

[project.scripts]
agent-tracer = "agent_tracer.run.cli:main"

[tool.pytest.ini_options]
# The suite is tests/. The `smoke_test.py` next to each MCP server is a
# standalone `uv run` script that spawns its server over stdio, not a pytest
# module — collecting them also collides three identical basenames in packages
# with no __init__.py.
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM", "B", "RUF"]
# The formatter owns line width. E501 then only fires on what the formatter
# cannot split — long string literals, URLs — so selecting it is pure noise.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The comment there names the LINE SEPARATOR and PARAGRAPH SEPARATOR
# characters it is about; "fixing" them to spaces erases what it documents.
"src/agent_tracer/mcp_servers/filesystem/server.py" = ["RUF003"]

[tool.mypy]
python_version = "3.13"
files = ["src"]
ignore_missing_imports = true    # stirrup and mcp ship no stubs

[tool.bandit]
# Tests exercise the unsafe paths on purpose; scanning them reports the setup,
# not the product.
exclude_dirs = ["tests", ".venv"]
