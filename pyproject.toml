[project]
name = "agent-tracer"
version = "0.1.0"
description = "Run agentic tasks and record structured trajectories as SFT/RL training data"
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.4.2",
    "datasets>=5.0.1",
    "mcp>=2.0,<3",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "stirrup[docker,mcp]==0.2.0",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "python-pptx>=1.0.2",
]

[project.scripts]
agent-tracer = "agent_tracer.run.cli:main"

[tool.pytest.ini_options]
# The suite is tests/. The `smoke_test.py` next to each MCP server is a
# standalone `uv run` script that spawns its server over stdio, not a pytest
# module — collecting them also collides three identical basenames in packages
# with no __init__.py.
testpaths = ["tests"]
python_files = ["test_*.py"]
