[project]
name = "agent-tracer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "click>=8.4.2",
    "datasets>=5.0.1",
    "mcp>=1.2,<2",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "stirrup[docker,mcp]==0.2.0",
]

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[project.scripts]
agent-tracer = "agent_tracer.run.cli:main"
