version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns: ["ruff", "mypy", "bandit", "pip-audit", "pip-licenses", "pytest*"]

  # Actions are the supply chain that runs with repository credentials; a
  # stale one is as much a risk as a stale library.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
