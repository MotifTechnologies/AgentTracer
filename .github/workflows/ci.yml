name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked --dev
      - name: ruff check
        run: uv run ruff check src tests
      - name: ruff format --check
        run: uv run ruff format --check src tests

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run pytest -q

  lock:
    name: lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
      # Fails when pyproject.toml moved but uv.lock did not, which is how a
      # dependency change reaches main without ever being resolved or audited.
      - run: uv lock --check

  typecheck:
    name: typecheck (advisory)
    runs-on: ubuntu-latest
    # Advisory until the 9 known findings are worked off; see CONTRIBUTING.md.
    # Flip to blocking by deleting this line and adding the job to the
    # required checks in the ruleset.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
      - run: uv sync --locked --dev
      - run: uv run mypy
