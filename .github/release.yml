# Sections of GitHub's generated release notes, by pull request label.
# A pull request lands in the first section whose label it carries.
changelog:
  categories:
    - title: Bug fixes
      labels: [bug]
    - title: Features and improvements
      labels: [enhancement]
    - title: Documentation
      labels: [documentation]
    - title: Dependencies
      labels: [dependencies]
    - title: Other changes
      labels: ["*"]
